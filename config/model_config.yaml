# Model Configuration
# This file controls which model to train, how to train it,
# and how to serve it. MLflow reads these at serve time.

model:
  name: inference-model
  framework: sklearn  # Options: sklearn, xgboost, pytorch, custom_pyfunc
  
training:
  test_size: 0.2
  random_state: 42
  
  # Framework-specific hyperparameters
  hyperparams:
    sklearn:
      n_estimators: 100
      max_depth: 5
    xgboost:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5

serving:
  # The MLflow model stage to serve (None, Staging, Production, Archived)
  stage: Production
  
  # Timeout in seconds for model loading
  load_timeout: 300
  
  # Number of gunicorn workers (for production)
  workers: 2
