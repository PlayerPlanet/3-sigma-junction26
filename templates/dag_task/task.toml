schema_version = "1.1"

[task]
name = "3-sigma/dag-lab-__SEED__"
description = "Causal discovery lab: run a few small observational or interventional experiments on a hidden 5-variable Bayesian network drawn from a fully disclosed prior, then forecast held-out interventions; scored by the exact expected log score under the true network."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "bayesian", "causal-inference", "bayesian-network", "mcp"]

[metadata]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "dag-lab"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]
