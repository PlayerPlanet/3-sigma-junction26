schema_version = "1.1"

[task]
name = "3-sigma/neuron-__WORLD__-__SEED__"
description = "NeuronBench (Murphy, arXiv 2608.09696) as a Harbor task: record from a hidden stochastic Hodgkin-Huxley neuron under a budget of current-clamp protocols and channel blockers, then forecast the spike counts of held-out protocols; scored by the benchmark spike-forecast MSE relative to the no-experiment forecast."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "forecasting", "electrophysiology", "hodgkin-huxley", "simulation-based-inference", "neuronbench", "mcp"]

[metadata]

[verifier]
timeout_sec = 720.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "neuron"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]
