# Merged on top of Harbor's base compose. The environment (and its true parameters) live in a
# separate container: the agent reaches it only through MCP and cannot read its state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_ENV: "__ENV__"
      TASK_SEED: "__SEED__"
      GRADER_TOKEN: "__TOKEN__"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
