schema_version = "1.1"

[task]
name = "3-sigma/chem-lab-3"
description = "Virtual chemistry lab: diagnose a faulty reactor with at most 10 experiments, then report a probability for each fault hypothesis, scored by the log score against the exact Bayesian posterior."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "bayesian", "chemistry", "mcp"]

[metadata]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "chem-lab"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]
