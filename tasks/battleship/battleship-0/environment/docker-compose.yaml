# Merged on top of Harbor's base compose. The board (and its hidden ships and rule) lives in a
# separate container: the agent reaches it only through MCP and cannot read its state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_SEED: "0"
      GRADER_TOKEN: "dZvmog07Np1-4jQrUDv1mwye6sOqZY4j"
      TASK_SALT: ""  # empty = random per trial (see server.py)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
