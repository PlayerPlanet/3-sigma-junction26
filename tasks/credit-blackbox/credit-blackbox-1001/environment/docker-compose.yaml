# The applicants (true segments, salt, noise draws) live in a separate container: the agent reaches
# them only through MCP and cannot read their state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_DESK: "1001"
      TASK_SEEDS: "150100,150102,150104,150106,150107,150108,150109,150111,150112,150114,150115,150116,150117,150118,150120,150121"
      TASK_VREF: "725.8636"
      GRADER_TOKEN: "NhLOp60IB9IS8VUnRk1b1OGyEFC-Y-CO"
      TASK_SALT: ""  # empty = random per trial
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
