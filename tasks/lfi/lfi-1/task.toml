schema_version = "1.1"

[task]
name = "3-sigma/lfi-lab-1"
description = "Likelihood-free single-cell lab: measure captured mRNA counts of a hidden autoregulated bursting gene (fully disclosed prior and an exact simulator, no likelihood), then forecast held-out conditions including a feedback-blocking drug; scored by the exact expected log score under the true rate constants (computed by finite state projection)."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "bayesian", "simulation-based-inference", "likelihood-free", "stochastic-gene-expression", "mcp"]

[metadata]

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "lfi-lab"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

