# Merged on top of Harbor's base compose config. Harbor configures `main` (the agent's
# container); we only add the environment's MCP server as a separate service, so the
# agent can reach it over the network but cannot read its code, seed or grader token.
#
# NOTE: multi-container tasks only run on Harbor's `docker` environment provider.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy

  mcp-server:
    build:
      context: ./mcp-server
    expose:
      - "8000"
      - "8001"
    environment:
      TASK_SEED: "1337"
      # Must match tests/grader_token. Neither file is visible to the agent.
      GRADER_TOKEN: "3sigma-grader-6f1d2b9e4c7a"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
