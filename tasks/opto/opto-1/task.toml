schema_version = "1.1"

[task]
name = "3-sigma/opto-lab-1"
description = "Optogenetics circuit-mapping lab (Light switch): under a cost budget, record, express ChR2/ArchT in chosen neuron populations and run light sessions (Hill-curve efficacy with hidden expression levels, heating artefact) on a hidden circuit drawn from a fully disclosed prior, then forecast ideal interventions on behaviour; scored by the exact expected log score under the true circuit."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "bayesian", "causal-inference", "optogenetics", "neuroscience", "mcp"]

