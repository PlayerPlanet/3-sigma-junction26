# Merged on top of the Harbor base compose. The hidden neuron lives in a separate container:
# the agent reaches it only through MCP and cannot read its state or this file.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_SEED: "0"
      NEURON_WORLD: "d_type"  # mechanism family; empty = drawn from the salt
      GRADER_TOKEN: "KdWlg1E1wn-Mcu9PmyQZ17yw7kRpnFcx"
      TASK_SALT: ""  # empty = random per trial (see server.py)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
