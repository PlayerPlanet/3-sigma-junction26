schema_version = "1.1"

[task]
name = "3-sigma/diag-lab-0"
description = "Diagnostic lab: find the cause of a failed batch by running tests with different costs within a budget, then report a probability for each cause, scored by the log score relative to the prior."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "bayesian", "diagnosis", "mcp"]

[metadata]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "diag-lab"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]
