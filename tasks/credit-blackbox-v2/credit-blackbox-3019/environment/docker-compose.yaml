# The applicants (true segments, salt, noise draws) live in a separate container: the agent reaches
# them only through MCP and cannot read their state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_DESK: "3019"
      TASK_SEEDS: "351904,351905,351907,351908,351909,351910,351913,351914,351915,351916,351917,351919,351920,351921,351922,351924,351925,351926,351928,351930"
      TASK_VREF: "1352.7124"
      GRADER_TOKEN: "gfGqJiI17xbMxLF9znWvSsWGqFeU6Jd0"
      TASK_SALT: ""  # empty = random per trial
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
