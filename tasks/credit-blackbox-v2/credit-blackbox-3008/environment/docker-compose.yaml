# The applicants (true segments, salt, noise draws) live in a separate container: the agent reaches
# them only through MCP and cannot read their state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_DESK: "3008"
      TASK_SEEDS: "350801,350802,350803,350804,350805,350806,350808,350809,350810,350811,350812,350813,350814,350815,350816,350818,350819,350820,350821,350822"
      TASK_VREF: "1233.3730"
      GRADER_TOKEN: "hN1WTfrZPe0A4U56WU2ijLvu1UtdpoqO"
      TASK_SALT: ""  # empty = random per trial
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
