# The applicants (true segments, salt, noise draws) live in a separate container: the agent reaches
# them only through MCP and cannot read their state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_DESK: "3004"
      TASK_SEEDS: "350400,350401,350402,350403,350404,350406,350407,350409,350410,350411,350414,350415,350416,350417,350419,350420,350422,350425,350427,350428"
      TASK_VREF: "1454.9672"
      GRADER_TOKEN: "6crZu7sJtJRQlcMXzEiFkdhHRKBzQqq1"
      TASK_SALT: ""  # empty = random per trial
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
