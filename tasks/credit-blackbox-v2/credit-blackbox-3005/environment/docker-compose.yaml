# The applicants (true segments, salt, noise draws) live in a separate container: the agent reaches
# them only through MCP and cannot read their state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_DESK: "3005"
      TASK_SEEDS: "350500,350501,350502,350503,350504,350505,350506,350507,350510,350511,350512,350514,350515,350516,350518,350519,350520,350522,350523,350524"
      TASK_VREF: "1137.1193"
      GRADER_TOKEN: "ZsTcQMj78P8k8Nacm6ZOKliHxsjdqKN2"
      TASK_SALT: ""  # empty = random per trial
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
