# The applicants (true segments, salt, noise draws) live in a separate container: the agent reaches
# them only through MCP and cannot read their state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_DESK: "3017"
      TASK_SEEDS: "351700,351701,351702,351706,351707,351708,351710,351712,351713,351714,351715,351716,351717,351719,351721,351722,351726,351727,351728,351729"
      TASK_VREF: "1095.6951"
      GRADER_TOKEN: "062xu5Ur_Bp1o7ApwXYMLkTWs11rgRax"
      TASK_SALT: ""  # empty = random per trial
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
