# Merged on top of Harbor's base compose. The lab (and its hidden rate constants) lives in a
# separate container: the agent reaches it only through MCP and cannot read its state.
services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    build:
      context: ./mcp-server
    expose: ["8000", "8001"]
    environment:
      TASK_SEED: "1"
      GRADER_TOKEN: "kYSJX96ZVk1-pF4RPUV69QGvGxkcHBRk"
      SOLUTION_TOKEN: "Oq_G51LkqmX5JLb9-n37octzYK4vpwbY"
      TASK_SALT: ""  # empty = random per trial (see server.py)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),timeout=2).close()"]
      interval: 2s
      timeout: 5s
      retries: 150
      start_period: 10s
