schema_version = "1.1"

[task]
name = "3-sigma/lfi2-lab-0"
description = "Likelihood-free single-cell lab, two species: measure captured mRNA or protein counts of a hidden gene with protein-mediated negative feedback (fully disclosed prior, an exact simulator, no likelihood; the 2-D master equation is too large to solve for every hypothesis in the container), then forecast held-out conditions; scored by the exact expected log score under the true rate constants (two-species FSP computed offline)."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "bayesian", "simulation-based-inference", "likelihood-free", "stochastic-gene-expression", "mcp"]

[metadata]

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 6144
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "lfi-lab2"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]
