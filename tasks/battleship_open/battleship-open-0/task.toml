schema_version = "1.1"

[task]
name = "3-sigma/battleship-open-0"
description = "Rulebound Battleship: find three hidden ships and the hidden rule that placed them with a budget of noisy shots and scans, then report calibrated beliefs, scored by the exact Bayesian log score."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "bayesian", "game", "mcp"]

[metadata]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "battleship"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

[verifier.env]

[environment.env]

[solution.env]
BATTLESHIP_WORLD = "open"
