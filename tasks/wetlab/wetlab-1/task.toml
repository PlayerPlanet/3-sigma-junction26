schema_version = "1.1"

[task]
name = "3-sigma/wetlab-1"
description = "Simulated stochastic wet lab: choose runs (substrate, catalyst, spike, temperature, sampling times) under a finite stock, then report a probability for each candidate reaction mechanism; scored by the log score relative to the prior."
authors = [{ name = "3-Sigma" }]
keywords = ["experimental-design", "bayesian", "chemistry", "stochastic-kinetics", "simulation-based-inference", "mcp"]

[metadata]

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "wetlab"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []

