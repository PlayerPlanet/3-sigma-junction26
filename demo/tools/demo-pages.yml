# Publishes demo/ as a static site on GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Runs on pushes to main that touch the site, or by hand from the Actions tab.
name: Deploy demo site

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "bench-pressure/index.html"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The lab pages wrap bench-pressure/index.html, so rebuild them from whatever is in the
      # repo now. If the game changed in a way the wrapper cannot handle, this step fails and
      # the old site stays up.
      - name: Rebuild the Bench Pressure pages
        run: python3 demo/tools/wrap_bench_pressure.py
      - name: Collect only the files the site serves
        run: |
          mkdir _site
          rsync -a demo/ _site/ \
            --exclude src --exclude tools --exclude node_modules \
            --exclude '*.md' --exclude 'package*.json' --exclude .gitignore \
            --exclude 'assets/models'
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
